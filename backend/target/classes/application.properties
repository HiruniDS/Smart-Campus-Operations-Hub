# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

app.upload.dir=uploads

# Google OAuth2 Configuration (reading from .env)
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET environment variables for real Google login.
# The 'not-configured' placeholders allow the app to start without OAuth2 credentials;
# only email/password login will work until real values are provided.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=profile,email

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.smartcampus=DEBUG
logging.level.com.cliauth=DEBUG
